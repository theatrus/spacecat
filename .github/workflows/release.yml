name: Release

permissions: write-all

on:
  push:
    tags:
      - 'v*.*.*'
  # A dry run that builds and SIGNS the Windows artifacts without cutting a
  # release. Signing is the part that cannot be reasoned about from the file --
  # the federated credential subject, the environment binding and the five
  # minute OIDC assertion only prove themselves by running -- and a tag is a
  # poor place to discover any of them is wrong.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp the artifacts with (no leading v)
        required: true
        default: 0.0.0

env:
  CARGO_TERM_COLOR: always
  # Embedded in the binary by build.rs
  CHATSTRONOMY_GIT_SHA: ${{ github.sha }}

jobs:
  create-release:
    name: Create Release
    # Never on a dispatch: it would publish a release named after a branch.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Chatstronomy ${{ github.ref_name }}
          body: |
            ## Chatstronomy Release ${{ github.ref_name }}
            
            ### Downloads
            - **Linux x86_64**: chatstronomy-linux-x86_64
            - **Linux aarch64**: chatstronomy-linux-aarch64
            - **Windows x64**: chatstronomy-windows-x64.exe (native build)
            - **Windows Installer**: Chatstronomy-${{ github.ref_name }}-x64.msi (includes service support)
            - **RPM Package**: chatstronomy-*.rpm (Fedora/RHEL/CentOS with systemd service)

            ### RPM Installation (Fedora/RHEL/CentOS)
            
            ```bash
            # Download and install the RPM
            wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/chatstronomy-*.rpm
            sudo dnf install ./chatstronomy-*.rpm
            
            # Configure the service
            sudo vim /etc/chatstronomy/config.json
            
            # Enable and start the service
            sudo systemctl enable --now chatstronomy.service
            ```
            
            See [CLAUDE.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CLAUDE.md) for detailed documentation.
          draft: false
          prerelease: false

  build-linux-x64:
    name: Build Linux x86_64
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-x64-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-x64-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Strip binary
        run: strip target/release/chatstronomy

      - name: Prepare release asset
        run: cp target/release/chatstronomy chatstronomy-linux-x86_64
          
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: ./chatstronomy-linux-x86_64

      - name: Get file info
        run: |
          ls -la chatstronomy-linux-x86_64
          file chatstronomy-linux-x86_64

  build-linux-arm64:
    name: Build Linux ARM64
    needs: create-release
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: arm64-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            arm64-cargo-

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Strip binary
        run: strip target/release/chatstronomy

      - name: Prepare release asset
        run: cp target/release/chatstronomy chatstronomy-linux-aarch64
          
      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: ./chatstronomy-linux-aarch64

      - name: Get file info
        run: |
          ls -la chatstronomy-linux-aarch64
          file chatstronomy-linux-aarch64

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --verbose

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

  build-windows:
    name: Build Windows Binary and MSI Installer
    needs: create-release
    # A skipped `needs` skips the dependent job, so say plainly that a dispatch
    # should still run: build and sign, just do not publish.
    if: always() && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    # The Entra federated credential is bound to
    # `repo:theatrus/chatstronomy:environment:release`, so this job must run in
    # that environment or the OIDC token subject will not match and azure/login
    # fails. Classic federated credentials require an exact subject match.
    environment: release
    env:
      # Signing is reserved for a pushed tag or a deliberate manual run, so
      # ordinary builds validate packaging without consuming signing quota. The
      # variable check keeps forks building (unsigned) rather than failing:
      # a fork has neither the variables nor the federated credential.
      SIGN_WINDOWS: >-
        ${{ ((github.event_name == 'push' && github.ref_type == 'tag')
        || github.event_name == 'workflow_dispatch')
        && vars.AZURE_CLIENT_ID != ''
        && 'true' || 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msi-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msi-
            ${{ runner.os }}-cargo-

      - name: Build Windows binary
        run: cargo build --release --verbose
        env:
          RUST_BACKTRACE: 1

      # Signed HERE, before anything copies it. target/release/chatstronomy.exe
      # is the single source for three artifacts: the standalone download, the
      # payload the MSI packages, and the runtime the N.I.N.A. plugin bundles.
      # Signing it once at the source is what keeps all three identical --
      # signing each copy separately invites one of them being missed.
      #
      # azure/login sits immediately before the signing step, never earlier: the
      # OIDC token it exchanges is a client assertion valid for five minutes,
      # and the cargo build above takes longer than that. A login placed before
      # the build leaves the CLI holding a dead assertion and signing fails with
      # AADSTS700024, which reads like a misconfiguration but is only elapsed
      # time.
      - name: Authenticate to Azure (for binary signing)
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the Windows binary
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\release\chatstronomy.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Prepare Windows binary
        run: cp target/release/chatstronomy.exe chatstronomy-windows-x64.exe

      - name: Upload Windows binary to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: ./chatstronomy-windows-x64.exe

      - name: Install WiX Toolset
        run: |
          # Download and install WiX Toolset v3.14
          $wixUrl = "https://github.com/wixtoolset/wix3/releases/download/wix314rtm/wix314.exe"
          $wixInstaller = "$env:TEMP\wix314.exe"
          Invoke-WebRequest -Uri $wixUrl -OutFile $wixInstaller
          Start-Process -FilePath $wixInstaller -ArgumentList "/install", "/quiet", "/norestart" -Wait
          # Add WiX to PATH
          $env:PATH += ";${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          echo "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Resolve version
        id: get_version
        run: |
          # On a dispatch there is no tag: github.ref_name is the branch, and
          # TrimStart('v') on a branch name yields nonsense that only shows up
          # later as a misnamed MSI.
          $version = if ('${{ github.event_name }}' -eq 'push') {
            "${{ github.ref_name }}".TrimStart('v')
          } else {
            "${{ inputs.version }}"
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Expected a three-part version. Got: $version"
          }
          # Both must use $env:. `>> $GITHUB_OUTPUT` is a pwsh variable that does
          # not exist, so it expands to empty and the redirect goes nowhere --
          # the step succeeds and the output is silently never set. Every later
          # reference to steps.get_version.outputs.version then interpolates to
          # nothing, which showed up as SignTool looking for
          # "Chatstronomy--x64.msi". The tag path had the same hole.
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build MSI package
        run: |
          Set-Location installer
          .\build-msi.ps1 -Version $env:VERSION -SkipBuild

      # A second login: MSI packaging sits between this and the one above, and
      # five minutes is not much of a budget.
      - name: Authenticate to Azure (for MSI signing)
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the MSI
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\installer\output\Chatstronomy-${{ env.VERSION }}-x64.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Checks the payload, not just the wrapper. A signed installer carrying an
      # unsigned program is the failure mode worth catching here: it verifies
      # perfectly at download and then shows Unknown Publisher on first run.
      # `msiexec /a` does an administrative extract, which restores real
      # filenames -- unpacking with 7z gives mangled ones and the check silently
      # matches nothing.
      - name: Verify the MSI and the program inside it
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          $msi = "$env:GITHUB_WORKSPACE\installer\output\Chatstronomy-$env:VERSION-x64.msi"
          $sig = Get-AuthenticodeSignature -LiteralPath $msi
          if ($sig.Status -ne 'Valid') { throw "MSI signature is $($sig.Status)" }
          Write-Output "MSI: $($sig.SignerCertificate.Subject)"

          $extract = Join-Path $env:RUNNER_TEMP 'msi-extract'
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $p = Start-Process msiexec -ArgumentList @('/a', "`"$msi`"", '/qn', "TARGETDIR=`"$extract`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /a failed with $($p.ExitCode)" }

          $inner = Get-ChildItem -LiteralPath $extract -Recurse -Filter 'chatstronomy.exe'
          if ($inner.Count -lt 1) { throw 'no chatstronomy.exe found inside the MSI' }
          foreach ($f in $inner) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            if ($s.Status -ne 'Valid') { throw "$($f.Name) inside the MSI is $($s.Status)" }
            Write-Output "payload OK: $($f.Name) -> $($s.SignerCertificate.Subject)"
          }

      - name: Upload MSI to release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: ./installer/output/Chatstronomy-${{ steps.get_version.outputs.version }}-x64.msi

      # A dispatch produces no release, so keep the signed artifacts where they
      # can be downloaded and inspected -- otherwise the dry run proves the
      # build succeeded and leaves nothing to verify by hand.
      - name: Upload signed artifacts for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: signed-windows-${{ steps.get_version.outputs.version }}
          path: |
            chatstronomy-windows-x64.exe
            installer/output/*.msi

      - name: Upload MSI as artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: ./installer/output/*.msi

  build-rpm:
    name: Build RPM Package
    needs: create-release
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    
    steps:
      - name: Install build dependencies
        run: |
          dnf update -y
          dnf install -y rpm-build rpm-devel rust cargo systemd-rpm-macros \
                         openssl-devel git tar gzip make

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building RPM version: $VERSION"

      - name: Create RPM build environment
        run: |
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

      - name: Build Rust binary
        run: |
          export RUST_BACKTRACE=1
          cargo build --release --verbose

      - name: Create source tarball
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TEMP_DIR=$(mktemp -d)
          SOURCE_DIR="$TEMP_DIR/chatstronomy-$VERSION"
          
          mkdir -p "$SOURCE_DIR"
          cp -r . "$SOURCE_DIR/"
          
          # Remove build artifacts and development files
          rm -rf "$SOURCE_DIR/target"
          rm -rf "$SOURCE_DIR/.git"
          rm -f "$SOURCE_DIR/.gitignore"
          rm -f "$SOURCE_DIR"/*.jpg "$SOURCE_DIR"/*.png
          
          cd "$TEMP_DIR"
          tar -czf ~/rpmbuild/SOURCES/chatstronomy-$VERSION.tar.gz chatstronomy-$VERSION
          
          # Clean up
          rm -rf "$TEMP_DIR"

      - name: Copy spec file
        run: |
          cp packaging/rpm/chatstronomy.spec ~/rpmbuild/SPECS/

      - name: Build RPM
        run: |
          cd ~/rpmbuild
          rpmbuild -ba SPECS/chatstronomy.spec

      - name: List built packages
        run: |
          echo "Built packages:"
          find ~/rpmbuild/RPMS -name "*.rpm" -type f
          find ~/rpmbuild/SRPMS -name "*.rpm" -type f

      - name: Get RPM file info
        id: rpm_info
        run: |
          RPM_FILE=$(find ~/rpmbuild/RPMS -name "chatstronomy-*.rpm" -type f | head -n1)
          if [ -n "$RPM_FILE" ]; then
            echo "RPM_FILE=$RPM_FILE" >> $GITHUB_OUTPUT
            echo "RPM_NAME=$(basename $RPM_FILE)" >> $GITHUB_OUTPUT
            rpm -qip "$RPM_FILE"
            cp "$RPM_FILE" ./
          fi

      - name: Upload RPM to release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: ./${{ steps.rpm_info.outputs.RPM_NAME }}

      - name: Get SRPM file info
        id: srpm_info
        run: |
          SRPM_FILE=$(find ~/rpmbuild/SRPMS -name "chatstronomy-*.src.rpm" -type f | head -n1)
          if [ -n "$SRPM_FILE" ]; then
            echo "SRPM_FILE=$SRPM_FILE" >> $GITHUB_OUTPUT
            echo "SRPM_NAME=$(basename $SRPM_FILE)" >> $GITHUB_OUTPUT
            cp "$SRPM_FILE" ./
          fi

      - name: Upload SRPM to release
        if: steps.srpm_info.outputs.SRPM_FILE != ''
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: ./${{ steps.srpm_info.outputs.SRPM_NAME }}
