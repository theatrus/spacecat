name: RPM

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

env:
  # Embedded in the binary by build.rs; the RPM builds from a source
  # tarball with no .git directory, so git can't provide it there.
  CHATSTRONOMY_GIT_SHA: ${{ github.sha }}
  # rpmbuild unpacks into a clean source tree, so cache compiler outputs rather
  # than its disposable Cargo target directory.
  RUSTC_WRAPPER: sccache
  SCCACHE_DIR: ${{ github.workspace }}/.cache/sccache

jobs:
  build:
    name: Build RPM on Fedora ${{ matrix.fedora }}
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ matrix.fedora }}
    strategy:
      fail-fast: false
      matrix:
        fedora: [ '44' ]

    steps:
      - name: Install build tooling
        run: |
          # Tooling needed before rpmbuild (source generation); the remaining
          # BuildRequires are pulled from the spec via `dnf builddep` below.
          dnf -y install --setopt=install_weak_deps=False \
            rpm-build rpmdevtools 'dnf-command(builddep)' \
            cargo git xz tar findutils sccache
          rpmdev-setuptree

      - uses: actions/checkout@v7
        with:
          # cargo vendor needs the source tree and git archive needs the
          # checkout to be a git repo; a full checkout is simplest.
          fetch-depth: 0

      - name: Mark checkout as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache RPM Rust compiler outputs
        uses: actions/cache@v6
        with:
          path: .cache/sccache
          key: rpm-fedora-${{ matrix.fedora }}-sccache-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', 'packaging/rpm/chatstronomy.spec') }}
          restore-keys: |
            rpm-fedora-${{ matrix.fedora }}-sccache-

      - name: Generate source tarballs (vendored crates)
        run: ./scripts/make-rpm-sources.sh

      - name: Build RPM
        run: |
          cp packaging/rpm/chatstronomy.spec ~/rpmbuild/SPECS/
          dnf -y builddep ~/rpmbuild/SPECS/chatstronomy.spec
          rpmbuild -ba ~/rpmbuild/SPECS/chatstronomy.spec

      - name: Report Rust compiler cache
        if: always()
        run: sccache --show-stats

      - name: Collect artifacts
        run: |
          mkdir -p out
          find ~/rpmbuild/RPMS ~/rpmbuild/SRPMS -name '*.rpm' -exec cp {} out/ \;
          ls -l out

      - name: Smoke-test the built binary
        run: |
          # dnf resolves Requires (incl. systemd pulled in by the unit/sysusers).
          dnf -y install out/chatstronomy-[0-9]*.x86_64.rpm
          chatstronomy --help
          test -f /usr/lib/systemd/system/chatstronomy.service
          test -f /etc/chatstronomy/config.json

      - uses: actions/upload-artifact@v7
        with:
          name: chatstronomy-fedora-${{ matrix.fedora }}-rpms
          path: out/*.rpm

      - name: Attach RPMs to the GitHub release
        # On tag builds only, add the binary RPMs to the release created by
        # release.yml (matched by tag; this only appends files, it does not
        # touch the release name/notes). The SRPM is left off to keep assets
        # lean -- it bundles the full vendored crate tree.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/chatstronomy-[0-9]*.x86_64.rpm
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
