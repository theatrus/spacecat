# Configuration for the chatstronomy.service systemd unit.
# After editing, apply with:  systemctl restart chatstronomy
#
# The application configuration (telescopes, chat services) lives in
# /etc/chatstronomy/config.json. These knobs only tune how the systemd unit invokes
# `chatstronomy chat-updater`.

# Seconds between event/image polls.
CHATSTRONOMY_INTERVAL=5

# Extra arguments appended verbatim to `chatstronomy chat-updater` (split on
# whitespace). Normally empty.
CHATSTRONOMY_EXTRA_ARGS=
